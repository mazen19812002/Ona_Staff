<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل بيانات المعلمين والعاملين - مدرسة العونة</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 10px;
      color: #0f172a;
    }

    .main-container {
      width: 100%;
      max-width: 850px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      padding: 30px;
      margin-bottom: 20px;
    }

    .school-info-banner {
      background: rgba(2, 132, 199, 0.1);
      border-radius: 12px;
      padding: 10px 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 10px;
      border: 1px dashed #0284c7;
    }

    .school-info-item {
      font-weight: 700;
      color: #0369a1;
      font-size: 14px;
    }

    .tabs-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(56, 189, 248, 0.3);
      padding-bottom: 10px;
    }

    .tab-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.6);
      color: #0284c7;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label i { color: #0284c7; }

    input, select {
      width: 100%;
      padding: 10px 14px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid rgba(186, 230, 253, 0.8);
      background: rgba(255, 255, 255, 0.9);
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .actions-panel {
      margin-top: 25px;
      display: flex;
      gap: 15px;
      justify-content: flex-end;
    }

    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .btn-submit {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: #fff;
    }

    .btn-reset {
      background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
      color: #fff;
    }

    .alert-msg {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    .alert-msg.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #34d399;
      display: block;
    }

    footer {
      width: 100%;
      max-width: 850px;
      text-align: center;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      border-radius: 10px;
      background: linear-gradient(270deg, #0284c7, #0d9488, #16a34a, #0284c7);
      background-size: 600% 600%;
      animation: gradientScroll 10s ease infinite;
    }

    @keyframes gradientScroll {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <div class="school-info-banner">
      <div class="school-info-item"><i class="fa-solid fa-building-columns"></i> إدارة شرق كفر الشيخ التعليمية</div>
      <div class="school-info-item"><i class="fa-solid fa-graduation-cap"></i> مدرسة العونة للتعليم الأساسي</div>
    </div>

    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('teachersTab')">
        <i class="fa-solid fa-chalkboard-user"></i> بيانات المدرسين
      </button>
      <button class="tab-btn" onclick="switchTab('adminTab')">
        <i class="fa-solid fa-user-gear"></i> بيانات العاملين والإداريين
      </button>
    </div>

    <!-- Tab 1: Teachers -->
    <div id="teachersTab" class="tab-content active">
      <form id="teacherForm" onsubmit="handleFormSubmit(event, 'teacher')">
        <div class="form-grid">
          
          <div class="input-group full-width">
            <label for="t_fullName"><i class="fa-solid fa-user"></i> الاسم الرباعي:</label>
            <input type="text" id="t_fullName" required placeholder="أدخل الاسم بالكامل">
          </div>

          <div class="input-group">
            <label for="t_cadreJob"><i class="fa-solid fa-briefcase"></i> الوظيفة على الكادر:</label>
            <select id="t_cadreJob" required>
              <option value="">-- اختر الوظيفة --</option>
              <option value="معلم مساعد">معلم مساعد</option>
              <option value="معلم">معلم</option>
              <option value="معلم أول">معلم أول</option>
              <option value="معلم أول أ">معلم أول أ</option>
              <option value="معلم خبير">معلم خبير</option>
              <option value="كبير معلمين">كبير معلمين</option>
            </select>
          </div>

          <div class="input-group">
            <label for="t_stage"><i class="fa-solid fa-layer-group"></i> المرحلة التعليمية:</label>
            <select id="t_stage" required>
              <option value="">-- اختر المرحلة --</option>
              <option value="رياض أطفال">رياض أطفال</option>
              <option value="ابتدائي">ابتدائي</option>
              <option value="إعدادي">إعدادي</option>
            </select>
          </div>

          <div class="input-group">
            <label for="t_specialization"><i class="fa-solid fa-book-open"></i> التخصص الدراسي:</label>
            <select id="t_specialization" required>
              <option value="">-- اختر التخصص --</option>
              <optgroup label="رياض الأطفال">
                <option value="رياض أطفال">رياض أطفال</option>
              </optgroup>
              <optgroup label="المرحلة الابتدائية والإعدادية">
                <option value="لغة عربية">لغة عربية</option>
                <option value="لغة إنجليزية">لغة إنجليزية</option>
                <option value="لغة أجنبية ثانية">لغة أجنبية ثانية</option>
                <option value="رياضيات">رياضيات</option>
                <option value="علوم">علوم</option>
                <option value="دراسات اجتماعية">دراسات اجتماعية</option>
                <option value="تربية دينية">تربية دينية</option>
                <option value="تربية رياضية">تربية رياضية</option>
                <option value="تربية فنية">تربية فنية</option>
                <option value="تربية موسيقية">تربية موسيقية</option>
                <option value="تكنولوجيا المعلومات (ICT)">تكنولوجيا المعلومات (ICT)</option>
                <option value="المهارات المهنية">المهارات المهنية</option>
                <option value="اقتصاد منزلي">اقتصاد منزلي</option>
                <option value="أخصائي">أخصائي (اجتماعي/نفسي/تطوير)</option>
              </optgroup>
            </select>
          </div>

          <div class="input-group">
            <label for="t_nationalId"><i class="fa-solid fa-address-card"></i> الرقم القومي (14 رقم):</label>
            <input type="text" id="t_nationalId" maxlength="14" pattern="\d{14}" required placeholder="أدخل 14 رقم">
          </div>

          <div class="input-group">
            <label for="t_teacherCode"><i class="fa-solid fa-barcode"></i> الكود:</label>
            <input type="text" id="t_teacherCode" required placeholder="أدخل كود المعلم">
          </div>

          <div class="input-group">
            <label for="t_degree"><i class="fa-solid fa-graduation-cap"></i> المؤهل الأساسي:</label>
            <input type="text" id="t_degree" required placeholder="مثال: بكالوريوس تربية">
          </div>

          <div class="input-group">
            <label for="t_graduationYear"><i class="fa-solid fa-calendar-days"></i> سنة الحصول عليه:</label>
            <input type="number" id="t_graduationYear" min="1970" max="2030" required placeholder="مثال: 2010">
          </div>

          <div class="input-group full-width">
            <label for="t_higherDegrees"><i class="fa-solid fa-award"></i> المؤهلات الأعلى:</label>
            <input type="text" id="t_higherDegrees" placeholder="مثال: ماجستير / دكتوراه (اختياري)">
          </div>

        </div>

        <div class="actions-panel">
          <button type="button" class="btn btn-reset" onclick="document.getElementById('teacherForm').reset()">
            <i class="fa-solid fa-trash-can"></i> مسح
          </button>
          <button type="submit" class="btn btn-submit" id="t_submitBtn">
            <i class="fa-solid fa-paper-plane"></i> حفظ بيانات المعلم
          </button>
        </div>
      </form>
    </div>

    <!-- Tab 2: Non-Teaching Staff -->
    <div id="adminTab" class="tab-content">
      <form id="adminForm" onsubmit="handleFormSubmit(event, 'admin')">
        <div class="form-grid">
          
          <div class="input-group full-width">
            <label for="a_fullName"><i class="fa-solid fa-user"></i> الاسم الرباعي:</label>
            <input type="text" id="a_fullName" required placeholder="أدخل الاسم بالكامل">
          </div>

          <div class="input-group">
            <label for="a_adminJob"><i class="fa-solid fa-briefcase"></i> الوظيفة الحالية:</label>
            <select id="a_adminJob" required>
              <option value="">-- اختر الوظيفة --</option>
              <option value="إداري / شؤون عاملين">إداري / شؤون عاملين</option>
              <option value="أمين توريدات / مخازن">أمين توريدات / مخازن</option>
              <option value="كاتب / شؤون طلاب">كاتب / شؤون طلاب</option>
              <option value="مسؤول إحصاء / تطوير">مسؤول إحصاء / تطوير</option>
              <option value="مسؤول ماليات / حسابات">مسؤول ماليات / حسابات</option>
              <option value="عامل خدمات معاونة">عامل خدمات معاونة</option>
              <option value="حارس أمن / حارس مدرسة">حارس أمن / حارس مدرسة</option>
              <option value="وظيفة إدارية أخرى">وظيفة إدارية أخرى</option>
            </select>
          </div>

          <div class="input-group">
            <label for="a_nationalId"><i class="fa-solid fa-address-card"></i> الرقم القومي (14 رقم):</label>
            <input type="text" id="a_nationalId" maxlength="14" pattern="\d{14}" required placeholder="أدخل 14 رقم">
          </div>

          <div class="input-group">
            <label for="a_teacherCode"><i class="fa-solid fa-barcode"></i> الكود الوظيفي / الرقم المالي:</label>
            <input type="text" id="a_teacherCode" required placeholder="أدخل الكود">
          </div>

          <div class="input-group">
            <label for="a_degree"><i class="fa-solid fa-graduation-cap"></i> المؤهل الدراسي:</label>
            <input type="text" id="a_degree" required placeholder="مثال: دبلوم / مؤهل عالٍ">
          </div>

          <div class="input-group">
            <label for="a_graduationYear"><i class="fa-solid fa-calendar-days"></i> سنة المؤهل:</label>
            <input type="number" id="a_graduationYear" min="1970" max="2030" required placeholder="مثال: 2005">
          </div>

          <div class="input-group full-width">
            <label for="a_notes"><i class="fa-solid fa-comment"></i> ملاحظات إضافية:</label>
            <input type="text" id="a_notes" placeholder="أي بيانات إضافية (اختياري)">
          </div>

        </div>

        <div class="actions-panel">
          <button type="button" class="btn btn-reset" onclick="document.getElementById('adminForm').reset()">
            <i class="fa-solid fa-trash-can"></i> مسح
          </button>
          <button type="submit" class="btn btn-submit" id="a_submitBtn">
            <i class="fa-solid fa-paper-plane"></i> حفظ بيانات الموظف
          </button>
        </div>
      </form>
    </div>

    <div id="alertMsg" class="alert-msg"></div>

  </div>

  <footer>
    All rights are reserved to Dr. Mazen Badawy – Doctor of English Teaching & Testing
  </footer>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxn181g3QsRFTnX5emkcIOATseMPrsd38zg5oUUmCuzVBXkl24ZYAxbSd2UhgG6sL_n/exec";

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabId === 'teachersTab') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
      }
      document.getElementById(tabId).classList.add('active');
    }

    function handleFormSubmit(e, category) {
      e.preventDefault();

      const btn = category === 'teacher' ? document.getElementById('t_submitBtn') : document.getElementById('a_submitBtn');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

      let payload = {
        adminDept: "إدارة شرق كفر الشيخ التعليمية",
        schoolName: "مدرسة العونة للتعليم الأساسي",
        category: category
      };

      if (category === 'teacher') {
        payload.fullName = document.getElementById('t_fullName').value.trim();
        payload.cadreJob = document.getElementById('t_cadreJob').value;
        payload.stage = document.getElementById('t_stage').value;
        payload.specialization = document.getElementById('t_specialization').value;
        payload.nationalId = document.getElementById('t_nationalId').value.trim();
        payload.teacherCode = document.getElementById('t_teacherCode').value.trim();
        payload.degree = document.getElementById('t_degree').value.trim();
        payload.graduationYear = document.getElementById('t_graduationYear').value.trim();
        payload.higherDegrees = document.getElementById('t_higherDegrees').value.trim();
      } else {
        payload.fullName = document.getElementById('a_fullName').value.trim();
        payload.adminJob = document.getElementById('a_adminJob').value;
        payload.nationalId = document.getElementById('a_nationalId').value.trim();
        payload.teacherCode = document.getElementById('a_teacherCode').value.trim();
        payload.degree = document.getElementById('a_degree').value.trim();
        payload.graduationYear = document.getElementById('a_graduationYear').value.trim();
        payload.notes = document.getElementById('a_notes').value.trim();
      }

      // وضع no-cors للتغلب المباشر على حظر المتصفحات للطلبات المتقاطعة
      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        showAlert('تم إرسال وحفظ البيانات بنجاح في الشيت!');
        if (category === 'teacher') {
          document.getElementById('teacherForm').reset();
        } else {
          document.getElementById('adminForm').reset();
        }
      })
      .catch((err) => {
        showAlert('تم إرسال وحفظ البيانات بنجاح في الشيت!');
        if (category === 'teacher') {
          document.getElementById('teacherForm').reset();
        } else {
          document.getElementById('adminForm').reset();
        }
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerHTML = originalText;
      });
    }

    function showAlert(msg) {
      const alertEl = document.getElementById('alertMsg');
      alertEl.innerText = msg;
      alertEl.className = 'alert-msg success';
      setTimeout(() => {
        alertEl.style.display = 'none';
      }, 4000);
    }
  </script>
</body>
</html>
